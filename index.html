<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Latih Tubi Bahasa Melayu Tahun 3</title>
  <style>
    :root {
      --primary: #4A90E2;
      --secondary: #FF9F43;
      --success: #2ECC71;
      --danger: #FF6B6B;
      --purple: #8E44AD;
      --bg: #F0F4F8;
      --card-bg: #FFFFFF;
      --text: #2C3E50;
    }

    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      align-items: center;
    }

    #app-container {
      width: 100%;
      max-width: 500px;
      min-height: 100vh;
      background-color: var(--card-bg);
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 20px rgba(0,0,0,0.1);
      position: relative;
      overflow: hidden;
    }

    header {
      background: linear-gradient(135deg, #4A90E2, #5C6BC0);
      color: white;
      padding: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      z-index: 10;
    }

    header h1 {
      margin: 0;
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .nav-btns {
      display: flex;
      gap: 8px;
    }

    .btn-nav {
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.4);
      color: white;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-nav:active {
      transform: scale(0.95);
      background: rgba(255, 255, 255, 0.4);
    }

    .view {
      flex: 1;
      padding: 20px;
      display: none;
      flex-direction: column;
      animation: fadeIn 0.3s ease-in-out;
    }

    .view.active {
      display: flex;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .menu-header {
      text-align: center;
      margin-bottom: 20px;
    }

    .menu-header h2 {
      margin: 0 0 5px 0;
      color: #333;
    }

    .menu-header p {
      margin: 0;
      color: #666;
      font-size: 0.9rem;
    }

    .grid-sets {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      padding-bottom: 20px;
    }

    .card-set {
      background: #F8FAFC;
      border: 2px solid #E2E8F0;
      border-radius: 16px;
      padding: 15px;
      text-align: center;
      cursor: pointer;
      position: relative;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .card-set.unlocked {
      background: #FFFFFF;
      border-color: var(--primary);
      box-shadow: 0 4px 12px rgba(74, 144, 226, 0.15);
    }

    .card-set.locked {
      opacity: 0.6;
      cursor: not-allowed;
      background: #E2E8F0;
    }

    .card-set .icon {
      font-size: 2rem;
      margin-bottom: 5px;
    }

    .card-set .title {
      font-weight: 700;
      font-size: 1rem;
      color: var(--text);
    }

    .card-set .score-badge {
      margin-top: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 10px;
      background: #E2E8F0;
      color: #4A5568;
    }

    .card-set.unlocked .score-badge {
      background: #EBF8FF;
      color: #2B6CB0;
    }

    .quiz-progress {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      font-weight: 600;
      color: #4A5568;
    }

    .progress-bar-bg {
      width: 100%;
      height: 10px;
      background-color: #E2E8F0;
      border-radius: 5px;
      margin-bottom: 20px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #4A90E2, #2ECC71);
      width: 0%;
      transition: width 0.3s ease;
    }

    .question-card {
      background: #F7FAFC;
      border: 2px solid #E2E8F0;
      border-radius: 16px;
      padding: 20px;
      font-size: 1.05rem;
      font-weight: 600;
      line-height: 1.5;
      margin-bottom: 20px;
      color: #2D3748;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .btn-audio-repeat {
      background: #E2E8F0;
      border: none;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.1rem;
      flex-shrink: 0;
      margin-left: 10px;
    }

    .btn-audio-repeat:active {
      transform: scale(0.9);
      background: #CBD5E0;
    }

    .options-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn-option {
      background: white;
      border: 2px solid #CBD5E0;
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 0.95rem;
      font-weight: 600;
      color: #2D3748;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s ease;
      outline: none;
    }

    .btn-option:active {
      transform: scale(0.98);
    }

    .btn-option.selected {
      border-color: var(--primary);
      background-color: #EBF8FF;
      box-shadow: 0 0 0 2px rgba(74, 144, 226, 0.2);
    }

    .btn-option.correct {
      background-color: #DEF7EC !important;
      border-color: #31C48D !important;
      color: #03543F !important;
    }

    .btn-option.wrong {
      background-color: #FDE8E8 !important;
      border-color: #F98080 !important;
      color: #9B1C1C !important;
    }

    .quiz-action-container {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn-action {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: bold;
      color: white;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    .btn-semak { background: var(--primary); }
    .btn-next { background: var(--success); }
    .btn-retry-action { background: var(--secondary); }
    .btn-jana { background: var(--purple); }

    .modal-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 100;
      padding: 20px;
      animation: fadeIn 0.2s ease;
    }

    .modal-card {
      background: white;
      border-radius: 20px;
      padding: 25px;
      width: 100%;
      max-width: 340px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }

    .modal-card.correct-modal h3 { color: var(--success); }
    .modal-card.wrong-modal h3 { color: var(--danger); }

    .modal-icon {
      font-size: 3.5rem;
      margin-bottom: 10px;
    }

    .btn-modal {
      margin-top: 15px;
      width: 100%;
      padding: 12px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }

    .result-card {
      text-align: center;
      background: #F8FAFC;
      border-radius: 20px;
      padding: 30px 20px;
      border: 2px solid #E2E8F0;
      margin-top: 20px;
    }

    .result-score {
      font-size: 3rem;
      font-weight: 800;
      color: var(--primary);
      margin: 15px 0;
    }

    .badge-status {
      display: inline-block;
      padding: 6px 16px;
      border-radius: 20px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .badge-pass { background: #DEF7EC; color: #03543F; }
    .badge-fail { background: #FDE8E8; color: #9B1C1C; }
  </style>
</head>
<body>

  <div id="app-container">
    <header>
      <h1>Latih Tubi BM Tahun 3</h1>
      <div class="nav-btns">
        <button class="btn-nav" onclick="goHome()">🏠 Utama</button>
        <button class="btn-nav" onclick="confirmReset()">🔄 Semula</button>
      </div>
    </header>

    <div id="view-menu" class="view active">
      <div class="menu-header">
        <h2>Pilih Set Latihan</h2>
        <p>Capai sekurang-kurangnya 50 markah untuk buka set seterusnya.</p>
      </div>
      <div id="sets-grid" class="grid-sets"></div>
    </div>

    <div id="view-quiz" class="view">
      <div class="quiz-progress">
        <span id="quiz-set-title">Set 1</span>
        <span id="quiz-step-text">Soalan 1/10</span>
      </div>
      <div class="progress-bar-bg">
        <div id="progress-bar-fill" class="progress-bar-fill"></div>
      </div>

      <div class="question-card">
        <span id="question-text">Memuatkan soalan...</span>
        <button class="btn-audio-repeat" onclick="ulangBacaSoalan()" title="Dengar Suara Perempuan Melayu">🔊</button>
      </div>

      <div id="options-container" class="options-container"></div>

      <div class="quiz-action-container">
        <button id="btn-semak" class="btn-action btn-semak" onclick="semakJawapan()">Semak Jawapan</button>
        <button id="btn-next" class="btn-action btn-next" style="display: none;" onclick="keSoalanSeterusnya()">Seterusnya ➔</button>
        <button id="btn-jana" class="btn-action btn-jana" onclick="janaSoalanBaharuMasaSebenar()">⚡ Jana Soalan Baharu</button>
      </div>
    </div>

    <div id="view-result" class="view">
      <div class="result-card">
        <div id="result-icon" style="font-size: 4rem;">🎉</div>
        <h2 id="result-title">Tahniah!</h2>
        <p id="result-subtitle">Selesai latihan set ini.</p>
        <div id="result-score" class="result-score">0 / 100</div>
        <div id="result-badge" class="badge-status badge-pass">Lulus</div>
        <p id="result-message" style="color: #4A5568; font-size: 0.95rem;"></p>

        <button id="btn-next-set" class="btn-modal" onclick="nextSetAction()">Seterusnya ➔</button>
        <button class="btn-modal" style="background:#718096; margin-top:10px;" onclick="goHome()">Kembali ke Muka Depan</button>
      </div>
    </div>

    <div id="feedback-modal" class="modal-overlay">
      <div id="modal-content" class="modal-card">
        <div id="modal-icon" class="modal-icon">👏</div>
        <h3 id="modal-title" style="margin:0 0 10px 0;">Syabas!</h3>
        <p id="modal-desc" style="margin:0; color:#4A5568; font-size:0.95rem;">Jawapan anda betul.</p>
        <button id="modal-btn" class="btn-modal" onclick="closeModal()">Teruskan</button>
      </div>
    </div>
  </div>

  <script>

    // FUNGSI MERAWAKAN PILIHAN JAWAPAN (RANDOMIZATION)
    function rawakPilihanJawapan(qData) {
      const gabungan = qData.options.map((opt, idx) => ({
        text: opt,
        isCorrect: idx === qData.answer
      }));

      for (let i = gabungan.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [gabungan[i], gabungan[j]] = [gabungan[j], gabungan[i]];
      }

      qData.shuffledOptions = gabungan.map(item => item.text);
      qData.shuffledAnswer = gabungan.findIndex(item => item.isCorrect);
    }

    // CARI SUARA PEREMPUAN MELAYU MALAYSIA (ms-MY)
    function dapatkanSuaraPerempuanMelayu() {
      if (!('speechSynthesis' in window)) return null;

      const voices = window.speechSynthesis.getVoices();

      let suaraPerempuan = voices.find(v => {
        const lang = v.lang.replace('_', '-').toLowerCase();
        const name = v.name.toLowerCase();

        const isMalay = lang === 'ms-my' || lang === 'ms';
        const isEnglish = lang.startsWith('en') || name.includes('english');
        const isIndonesian = lang.startsWith('id') || name.includes('indonesia');

        if (!isMalay || isEnglish || isIndonesian) return false;

        return name.includes('yasmin') || name.includes('female') || name.includes('perempuan') || name.includes('google');
      });

      if (!suaraPerempuan) {
        suaraPerempuan = voices.find(v => {
          const lang = v.lang.replace('_', '-').toLowerCase();
          const name = v.name.toLowerCase();
          return (lang === 'ms-my' || lang === 'ms') && !lang.startsWith('en') && !name.includes('english');
        });
      }

      return suaraPerempuan;
    }

    // FUNGSI UTAMA SEBUTAN
    function speakBM(teks) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
      if (currentAudioObj) {
        currentAudioObj.pause();
      }

      let teksDibersihkan = teks.replace(/_+/g, 'tempat kosong');
      const suaraPerempuan = dapatkanSuaraPerempuanMelayu();

      if (suaraPerempuan) {
        const utterance = new SpeechSynthesisUtterance(teksDibersihkan);
        utterance.voice = suaraPerempuan;
        utterance.lang = 'ms-MY';
        utterance.rate = 0.85;
        utterance.pitch = 1.15;
        window.speechSynthesis.speak(utterance);
      } else {
        const encodedText = encodeURIComponent(teksDibersihkan);
        const audioUrl = `https://translate.google.com/translate_tts?ie=UTF-8&q=${encodedText}&tl=ms&client=tw-ob`;
        
        currentAudioObj = new Audio(audioUrl);
        currentAudioObj.playbackRate = 0.9;
        currentAudioObj.play().catch(e => {
          console.warn("Audio automatik dihalang oleh pelayar.", e);
        });
      }
    }

    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = () => {
        dapatkanSuaraPerempuanMelayu();
      };
    }

    function loadProgress() {
      const savedUnlocked = localStorage.getItem('bm_t3_unlocked_female_msmy');
      const savedScores = localStorage.getItem('bm_t3_scores_female_msmy');
      if (savedUnlocked) unlockedSets = parseInt(savedUnlocked, 10);
      if (savedScores) scoresHistory = JSON.parse(savedScores);
    }

    function saveProgress() {
      localStorage.setItem('bm_t3_unlocked_female_msmy', unlockedSets);
      localStorage.setItem('bm_t3_scores_female_msmy', JSON.stringify(scoresHistory));

    function initApp() {
      loadProgress();

    function renderMenu() {
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      if (currentAudioObj) currentAudioObj.pause();
      
      showView('view-menu');
      const grid = document.getElementById('sets-grid');
      grid.innerHTML = '';

      questionBank.forEach((set, idx) => {
        const isUnlocked = idx < unlockedSets;
        const card = document.createElement('div');
        card.className = `card-set ${isUnlocked ? 'unlocked' : 'locked'}`;

        const score = scoresHistory[idx];
        const statusText = isUnlocked 
          ? (score > 0 ? `Markah: ${score}` : 'Belum Buat') 
          : 'Terkunci 🔒';

        card.innerHTML = `
          <div class="icon">${isUnlocked ? '📝' : '🔒'}</div>
          <div class="title">${set.setName}</div>
          <div class="score-badge">${statusText}</div>
        `;

        if (isUnlocked) {
          card.onclick = () => startSet(idx);
        }

        grid.appendChild(card);
      });
    }

    function showView(viewId) {
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.getElementById(viewId).classList.add('active');
    }

    function startSet(setIndex) {
      currentSetIndex = setIndex;
      currentQuestionIndex = 0;
      currentScore = 0;

      questionBank[currentSetIndex].questions.forEach(q => {
        rawakPilihanJawapan(q);
      });

      showView('view-quiz');
      loadQuestion();
    }

    function loadQuestion() {
      selectedOptionIndex = null;
      isQuestionChecked = false;

      const setData = questionBank[currentSetIndex];
      const qData = setData.questions[currentQuestionIndex];

      if (!qData.shuffledOptions) {
        rawakPilihanJawapan(qData);
      }

      document.getElementById('quiz-set-title').innerText = setData.setName;
      document.getElementById('quiz-step-text').innerText = `Soalan ${currentQuestionIndex + 1}/10`;
      
      const progressPercent = ((currentQuestionIndex) / 10) * 100;
      document.getElementById('progress-bar-fill').style.width = `${progressPercent}%`;

      document.getElementById('question-text').innerText = `${currentQuestionIndex + 1}. ${qData.q}`;

      const optionsContainer = document.getElementById('options-container');
      optionsContainer.innerHTML = '';

      qData.shuffledOptions.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'btn-option';
        const labelText = `${optionPrefixes[idx]}. ${opt}`;
        btn.innerText = labelText;
        btn.onclick = () => selectOption(idx, btn, labelText);
        optionsContainer.appendChild(btn);
      });

      const btnSemak = document.getElementById('btn-semak');
      const btnNext = document.getElementById('btn-next');
      btnSemak.style.display = 'block';
      btnNext.style.display = 'none';

      ulangBacaSoalan();
    }

    // FUNGSI JANA SOALAN BAHARU SECARA MASA SEBENAR (REAL-TIME DYNAMIC GENERATION)
    function janaSoalanBaharuMasaSebenar() {
      const generator = dynamicGenerators[currentSetIndex];
      if (generator) {
        const dynamicQ = generator();
        rawakPilihanJawapan(dynamicQ);
        questionBank[currentSetIndex].questions[currentQuestionIndex] = dynamicQ;
        loadQuestion();
        speakBM("Soalan baharu telah dijana.");
      }
    }

    function ulangBacaSoalan() {
      const setData = questionBank[currentSetIndex];
      const qData = setData.questions[currentQuestionIndex];
      speakBM(`Soalan nombor ${currentQuestionIndex + 1}. ${qData.q}`);
    }

    function selectOption(index, btnElement, optionText) {
      if (isQuestionChecked) return;

      selectedOptionIndex = index;
      const allButtons = document.querySelectorAll('.btn-option');
      allButtons.forEach(b => b.classList.remove('selected'));
      btnElement.classList.add('selected');

      speakBM(optionText);
    }

    function semakJawapan() {
      if (selectedOptionIndex === null) {
        speakBM("Sila pilih satu jawapan dahulu.");
        alert("Sila pilih satu jawapan dahulu.");
        return;
      }

      isQuestionChecked = true;
      const setData = questionBank[currentSetIndex];
      const qData = setData.questions[currentQuestionIndex];
      const allButtons = document.querySelectorAll('.btn-option');

      const btnSemak = document.getElementById('btn-semak');
      const btnNext = document.getElementById('btn-next');

      btnSemak.style.display = 'none';
      btnNext.style.display = 'block';

      if (selectedOptionIndex === qData.shuffledAnswer) {
        isLastAnswerCorrect = true;
        allButtons[selectedOptionIndex].classList.add('correct');
        currentScore += 10;

        const randomCompliment = pujianBM[Math.floor(Math.random() * pujianBM.length)];
        
        btnNext.className = "btn-action btn-next";
        btnNext.innerText = "Seterusnya ➔";

        speakBM(randomCompliment);
        showModal(true, '🎉 Syabas!', randomCompliment, 'Teruskan ➔');
      } else {
        isLastAnswerCorrect = false;
        allButtons[selectedOptionIndex].classList.add('wrong');
        allButtons[qData.shuffledAnswer].classList.add('correct');

        btnNext.className = "btn-action btn-retry-action";
        btnNext.innerText = "Ulang Soalan 🔄";

        speakBM("Jawapan kamu kurang tepat. Sila cuba lagi.");
        showModal(false, '❌ Salah', 'Jawapan kurang tepat. Cuba lagi ya!', 'Ulang Soalan 🔄');
      }
    }

    function keSoalanSeterusnya() {
      if (isLastAnswerCorrect) {
        currentQuestionIndex++;
        if (currentQuestionIndex < 10) {
          loadQuestion();
        } else {
          finishSet();
        }
      } else {
        loadQuestion();
      }
    }

    function showModal(isCorrect, title, desc, btnText) {
      setTimeout(() => {
        const modal = document.getElementById('feedback-modal');

        modalContent.className = `modal-card ${isCorrect ? 'correct-modal' : 'wrong-modal'}`;
        document.getElementById('modal-icon').innerText = isCorrect ? '🌟' : '💡';
        document.getElementById('modal-title').innerText = title;
        document.getElementById('modal-desc').innerText = desc;
        document.getElementById('modal-btn').innerText = btnText;

        modal.style.display = 'flex';
      }, 300);
    }

    function closeModal() {
      const modal = document.getElementById('feedback-modal');
      modal.style.display = 'none';

      if (isLastAnswerCorrect) {
        currentQuestionIndex++;
        if (currentQuestionIndex < 10) {
          loadQuestion();
        } else {
          finishSet();
        }
      } else {
        loadQuestion();
      }
    }

    function finishSet() {
      if (currentScore > scoresHistory[currentSetIndex]) {
        scoresHistory[currentSetIndex] = currentScore;
      }

      const passed = currentScore >= 50;
      if (passed && currentSetIndex + 1 >= unlockedSets && unlockedSets < 10) {
        unlockedSets = currentSetIndex + 2;
      }

      saveProgress();

      showView('view-result');
      document.getElementById('result-score').innerText = `${currentScore} / 100`;

      const badge = document.getElementById('result-badge');
      const nextBtn = document.getElementById('btn-next-set');

      if (passed) {
        document.getElementById('result-icon').innerText = '🏆';
        document.getElementById('result-title').innerText = 'Tahniah!';
        document.getElementById('result-subtitle').innerText = 'Kamu berjaya lulus set latihan ini!';
        badge.className = 'badge-status badge-pass';
        badge.innerText = 'LULUS';
        document.getElementById('result-message').innerText = currentSetIndex < 9 
          ? 'Set latihan seterusnya telah dibuka!' 
          : 'Hebat! Kamu telah selesaikan semua set latihan!';
        
        speakBM("Tahniah! Kamu berjaya lulus set latihan ini.");

        if (currentSetIndex < 9) {
          nextBtn.style.display = 'block';
          nextBtn.onclick = () => startSet(currentSetIndex + 1);
        } else {
          nextBtn.style.display = 'none';
        }
      } else {
        document.getElementById('result-icon').innerText = '💪';
        document.getElementById('result-title').innerText = 'Cuba Lagi!';
        document.getElementById('result-subtitle').innerText = 'Kamu perlu sekurang-kurangnya 50 markah untuk lulus.';
        badge.className = 'badge-status badge-fail';
        badge.innerText = 'BELUM LULUS';
        document.getElementById('result-message').innerText = 'Ulang semula set ini untuk buka set seterusnya.';
        
        speakBM("Cuba lagi. Kamu perlukan sekurang-kurangnya 50 markah.");

        nextBtn.style.display = 'block';
        nextBtn.innerText = 'Ulang Set Ini 🔄';
        nextBtn.onclick = () => startSet(currentSetIndex);
      }
    }

    function goHome() {
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      if (currentAudioObj) currentAudioObj.pause();
      renderMenu();
    }

    function confirmReset() {
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      if (currentAudioObj) currentAudioObj.pause();

      if (confirm("Adakah anda pasti ingin menetapkan semula semua markah?")) {
        localStorage.clear();
        unlockedSets = 1;
        scoresHistory = Array(10).fill(0);
        saveProgress();
        renderMenu();
        alert("Semua markah telah ditetapkan semula.");
      }
    }

    window.onload = initApp;
  </script>
</body>
</html>
